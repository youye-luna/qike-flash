[package]
name = "multi-burn"
version = "0.0.1-alpha"
edition = "2021"
description = "多 U 盘 / SD 卡批量烧录内核（Windows 后端 + M0）"
license = "Apache-2.0"

[dependencies]
chrono = "0.4"
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
xz2 = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
